version: "3.9"

services:
  api:
    build: .
    container_name: adonis_api
    ports:
      - "3333:3333"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:17.4-alpine3.20
    container_name: adonis_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydatabase
    ports:
      - "5000:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgres_data: