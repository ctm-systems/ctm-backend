services:
  api:
    build: .
    container_name: adonis_api
    ports:
      - "3333:3333"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
      - ./public/uploads:/app/public/uploads
      - ./tmp:/app/tmp

  db:
    image: postgres:17.4-alpine3.20
    container_name: adonis_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ctm
    ports:
      - "5000:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgres_data:
